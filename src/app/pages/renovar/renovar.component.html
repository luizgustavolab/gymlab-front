<div class="profile-container" style="justify-content: center; min-height: 100vh; height: auto; overflow-y: auto; padding: 20px 12px 40px 12px; box-sizing: border-box;">
  <main class="profile-content" style="width: 100%; max-width: 550px; float: none; margin: 0 auto;">
    <div class="profile-card" style="height: auto; min-height: unset; box-sizing: border-box;">
      <div class="profile-header">
        <h1>Configurar Nova Ficha</h1>
        <p>Preencha os dados abaixo para gerar um novo plano. <strong>Atenção: sua ficha atual será deletada permanentemente.</strong></p>
      </div>

      <form [formGroup]="form" (ngSubmit)="confirmarRenovacao()" class="profile-form">
        
        <div class="field">
          <label>Gênero</label>
          <select class="select" formControlName="genero">
            <option value="">Selecione</option>
            <option value="MASCULINO">Masculino</option>
            <option value="FEMININO">Feminino</option>
          </select>
        </div>

        <div class="field">
          <label>Peso (kg)</label>
          <select class="select" formControlName="peso">
            <option [value]="null" disabled selected>Selecione</option>
            <option *ngFor="let p of listaPesos" [value]="p">{{ p }} kg</option>
          </select>
        </div>

        <div class="field">
          <label>Altura (m)</label>
          <select class="select" formControlName="altura">
            <option [value]="null" disabled selected>Selecione</option>
            <option *ngFor="let a of listaAlturas" [value]="a.value">{{ a.label }}</option>
          </select>
        </div>

        <div class="field">
          <label>Objetivo</label>
          <select class="select" formControlName="objetivo">
            <option value="">Selecione</option>
            <option value="Hipertrofia">Hipertrofia</option>
            </select>
        </div>

        <div class="field">
          <label>Dias de treino por semana</label>
          <select class="select" formControlName="diasPorSemana">
            <option [value]="null" disabled>Selecione</option>
            <option *ngFor="let d of listaDias" [value]="d.value">{{ d.label }}</option>
          </select>
        </div>

        <div class="field">
          <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
            <input type="checkbox" formControlName="concordou">
            Entendo que a ficha atual será deletada.
          </label>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px; width: 100%;">
          <button type="submit" class="save-button" style="width: 100% !important; min-width: 0 !important; box-sizing: border-box;" [disabled]="form.invalid || carregando()">
            {{ carregando() ? 'Processando...' : 'Confirmar e Gerar Nova' }}
          </button>
          <button type="button" class="save-button" style="width: 100% !important; min-width: 0 !important; box-sizing: border-box; background: #334155;" (click)="voltar()">
            Voltar
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
