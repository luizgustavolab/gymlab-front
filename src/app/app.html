@if (exibirBanner()) {
  <div class="fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md w-screen h-screen"
       style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px); z-index: 9999;">
    
    <div class="w-[calc(100%-2rem)] max-w-md p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl text-slate-200"
         style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 2rem); max-w: 28rem; padding: 1.5rem; background-color: #0f172a; border: 1px solid #1e293b; border-radius: 1rem; color: #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
      
      <div class="text-center space-y-3" style="text-align: center; margin-bottom: 1.5rem;">
        <h3 class="text-lg font-bold text-white flex items-center justify-center gap-2" style="font-size: 1.125rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem;">
          <span>🍪</span> Privacidade e Consentimento
        </h3>
        <p class="text-xs sm:text-sm text-slate-400 leading-relaxed" style="font-size: 0.875rem; color: #94a3b8; line-height: 1.625;">
          Coletamos dados de conformidade (logs de consentimento e IP mascarado) para garantir a segurança da sua conta e aprimorar sua experiência de treino no GymLab, em total conformidade com a LGPD.
        </p>
      </div>

      <div class="flex flex-col w-full" style="display: flex; flex-direction: column; width: 100%;">
        <button (click)="computarConsentimento(true)" class="w-full px-6 py-3 text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl shadow-lg transition-all cursor-pointer text-center min-h-[48px] flex items-center justify-center"
                style="width: 100%; padding: 0.75rem 1.5rem; font-size: 0.875rem; font-weight: 600; background-color: #10b981; color: #020617; border-radius: 0.75rem; border: none; cursor: pointer; text-align: center;">
          Aceitar todos
        </button>
        
        <button (click)="computarConsentimento(false)" class="w-full px-5 py-3 text-sm font-medium text-slate-400 hover:text-white rounded-xl transition-all cursor-pointer text-center"
                style="width: 100%; margin-top: 1rem; padding: 0.75rem 1.25rem; font-size: 0.875rem; font-weight: 500; color: #94a3b8; background: transparent; border-radius: 0.75rem; border: none; cursor: pointer; text-align: center;">
          Recusar opcionaiiiiis
        </button>
      </div>

    </div>

  </div>
}

<router-outlet />
