<div class="app-shell">
  <router-outlet />
</div>

@if (exibirBanner()) {
  <div class="lgpd-overlay visible">
    <div class="lgpd-modal">
      <h2 class="lgpd-title">Privacidade e Consentimento</h2>
      <p class="lgpd-text">
        Coletamos logs mínimos de consentimento para autenticação e segurança.
      </p>
      <div class="button-group">
        <button class="btn-primary" (click)="computarConsentimento(true)">Aceitar todos</button>
        <button class="btn-secondary" (click)="computarConsentimento(false)">Recusar opcionais</button>
      </div>
    </div>
  </div>
}
